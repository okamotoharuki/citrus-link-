<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>送信完了 - Citrus Link</title>
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background: linear-gradient(to right, #fefae0, #e0f7fa);
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 500px;
    }
    h1 {
      font-size: 2rem;
      color: #264653;
    }
    p {
      font-size: 1.1rem;
      margin: 1rem 0 2rem;
    }
    a.button {
      display: inline-block;
      padding: 0.8rem 1.5rem;
      background-color: #219ebc;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    a.button:hover {
      background-color: #197b9b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>送信ありがとうございます</h1>
    <p>資料請求の内容を受け付けました。<br>確認後、ご連絡差し上げます。</p>
    <a href="index.html" class="button">トップページに戻る</a>
  </div>
</body>
</html>
