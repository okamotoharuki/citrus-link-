<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>資料請求フォーム - Citrus Link</title>
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background: linear-gradient(to right, #fefae0, #e0f7fa);
      color: #333;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 5vh auto;
      background: white;
      border-radius: 12px;
      padding: 3rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 2rem;
      color: #264653;
      margin-bottom: 2rem;
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 1rem;
      font-weight: bold;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      margin-top: 1.5rem;
      background-color: #219ebc;
      color: white;
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #197b9b;
    }
    .back-link {
      display: block;
      margin-top: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>資料請求フォーム</h1>
    <form action="https://formspree.io/f/mnqkzbjp" method="POST">
      <label>お名前（必須）
        <input type="text" name="name" required>
      </label>

      <label>農産物の内容（必須）
        <textarea name="product" rows="4" required></textarea>
      </label>

      <label>メールアドレス（返信用・必須）
        <input type="email" name="email" required>
      </label>

      <label>電話番号（任意）
        <input type="text" name="phone">
      </label>

      <button type="submit">送信する</button>
    </form>

    <div class="back-link">
      <a href="index.html">← ホームページに戻る</a>
    </div>
  </div>
</body>
</html>
